name: Sync upstream main

on:
  schedule:
    # 10:17 Asia/Shanghai (02:17 UTC) every day.
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    name: Merge upstream main into this repository's main
    runs-on: ubuntu-latest
    steps:
      - name: Check out fork main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Configure sync identity and upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/yuanbw2025/storyforge.git

      - name: Fetch and merge upstream main
        run: |
          git fetch --no-tags upstream refs/heads/main:refs/remotes/upstream/main
          if git merge --no-edit upstream/main; then
            exit 0
          fi

          mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
          if [[ ${#conflicts[@]} -eq 1 ]] &&
             [[ "${conflicts[0]}" == "package-lock.json" ]] &&
             git diff --quiet upstream/main -- package.json; then
            # The npm lockfile is generated. When the merged manifest exactly
            # matches upstream, keep its matching lockfile to avoid lock-only conflicts.
            git checkout --theirs -- package-lock.json
            git add package-lock.json
            git commit --no-edit
          else
            echo "::error::Upstream merge has conflicts outside a package-lock-only update."
            printf '%s\n' "${conflicts[@]}"
            git merge --abort
            exit 1
          fi

      - name: Push synchronized main
        run: git push origin HEAD:refs/heads/main
